# Starship config - Blue Powerline Theme
format = """
[](blue)\
$username\
[](fg:blue bg:blue)\
$directory\
[](fg:blue bg:blue)\
$git_branch\
$git_status\
[](fg:blue)\
$character
"""

add_newline = true

[username]
show_always = true
style_user = "bg:blue fg:white"
format = "[$user]($style)"

[directory]
style = "bg:blue fg:white"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:blue fg:white"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:blue fg:white"
format = '[$all_status$ahead_behind]($style)'

[character]
success_symbol = "[ ➜](bold blue)"
error_symbol = "[ ✗](bold blue)"

[python]
symbol = " "
style = "bold blue"

[rust]
symbol = " "
style = "bold blue"

[node_js]
symbol = " "
style = "bold blue"

